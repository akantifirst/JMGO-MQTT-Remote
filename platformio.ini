[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Optional local serial settings:
; upload_port = /dev/cu.usbserial-0001
; monitor_port = /dev/cu.usbserial-0001

lib_deps =
  h2zero/NimBLE-Arduino
  knolleary/PubSubClient

[env:esp32ota]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

upload_protocol = espota
; Provide your device address and OTA password locally, for example:
; upload_port = <esp32-ip>
; upload_flags =
;   --auth=<ota-password>

lib_deps =
  h2zero/NimBLE-Arduino
  knolleary/PubSubClient
